[project]
name = "ai-tools"
version = "0.1.0"
description = "Public monorepo of AI / LLM tools"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
google = ["google-generativeai>=0.8"]
litellm = ["litellm>=1.50"]
all = [
    "openai>=1.50",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "litellm>=1.50",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
